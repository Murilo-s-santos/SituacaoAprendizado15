<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINETIC | Filmes & Séries</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar Minimalista -->
  <header id="navbar">
    <div class="logo">KINETIC</div>
    <nav class="nav-links">
      <a href="#">Lançamentos</a>
      <a href="#">Séries</a>
      <a href="#">Filmes</a>
      <a href="#">K-Originals</a>
    </nav>
    <div class="nav-icons">
      <button class="icon-btn">🔍</button>
      <button class="icon-btn">👤</button>
    </div>
  </header>

  <!-- Hero Banner - Imagem de Impacto -->
  <main>
    <section class="hero">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <span class="badge">Série Original</span>
        <h1 class="hero-title">A QUEDA<br>DO IMPÉRIO</h1>
        <p class="hero-subtitle">Não apenas assista. Sinta. A nova temporada já está disponível.</p>
        <div class="hero-actions">
          <button class="btn btn-primary">ASSISTIR AGORA</button>
          <button class="btn btn-secondary">VER TRAILER</button>
        </div>
      </div>
    </section>

    <!-- Seção de Carrossel (Estilo vitrine de produtos) -->
    <section class="trending-section">
      <div class="section-header">
        <h2 class="section-title">EM DESTAQUE</h2>
        <div class="carousel-controls">
          <button id="scroll-left" class="arrow-btn">←</button>
          <button id="scroll-right" class="arrow-btn">→</button>
        </div>
      </div>
      
      <div class="carousel" id="carousel">
        <!-- Card 1 -->
        <div class="card">
          <div class="card-img-box">
            <img src="https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=600&auto=format&fit=crop" alt="Pôster do Filme">
          </div>
          <div class="card-info">
            <h3>CYBERPUNK CITY</h3>
            <p>Ficção Científica</p>
          </div>
        </div>
        <!-- Card 2 -->
        <div class="card">
          <div class="card-img-box">
            <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=600&auto=format&fit=crop" alt="Pôster do Filme">
          </div>
          <div class="card-info">
            <h3>O SILÊNCIO</h3>
            <p>Suspense / Terror</p>
          </div>
        </div>
        <!-- Card 3 -->
        <div class="card">
          <div class="card-img-box">
            <img src="https://images.unsplash.com/photo-1509347528160-9a9e33742cdb?q=80&w=600&auto=format&fit=crop" alt="Pôster do Filme">
          </div>
          <div class="card-info">
            <h3>ANOMALIA</h3>
            <p>Drama</p>
          </div>
        </div>
        <!-- Card 4 -->
        <div class="card">
          <div class="card-img-box">
            <img src="https://images.unsplash.com/photo-1605810230434-7631ac76ec81?q=80&w=600&auto=format&fit=crop" alt="Pôster do Filme">
          </div>
          <div class="card-info">
            <h3>ECLIPSE FINAL</h3>
            <p>Ação</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
